<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okos Kamra Vezérlő</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .section { display: none; }
        .active { display: block; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-green { background: #34a853; }
        .btn-orange { background: #fbbc05; color: black; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        .qty { background: #e8f0fe; padding: 5px 10px; border-radius: 5px; font-weight: bold; color: #1a73e8; }
        .shopping-list { background: #fffde7; border: 1px dashed #fbc02d; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .admin-btn { background: #5f6368; margin-top: 25px; font-size: 11px; opacity: 0.7; }
        .card { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Okos Kamra</h2>

    <div id="loginSection" class="section active">
        <input type="text" id="devID" placeholder="Eszköz ID (pl: Pantry-740c86c)">
        <input type="password" id="pass" placeholder="Jelszó">
        <hr>
        <p style="font-size:12px; color:#666;">Új eszköznél add meg ezeket is az aktiváláshoz:</p>
        <input type="email" id="email" placeholder="E-mail címed">
        <input type="password" id="newPass" placeholder="Új saját jelszó">
        <button onclick="handleLogin()">BELÉPÉS / AKTIVÁLÁS</button>
        <button class="admin-btn" onclick="openAdmin()">ADMIN PANEL</button>
    </div>

    <div id="inventorySection" class="section">
        <p>Eszköz: <strong id="displayID"></strong></p>
        
        <button class="btn-green" onclick="generateShoppingList()">🛒 Bevásárlólista generálása</button>
        <button class="btn-orange" onclick="getRecipe()">🍳 Mit főzzek ebből? (AI Recept)</button>

        <div id="shoppingListDisplay" class="shopping-list" style="display:none;"></div>
        
        <div id="itemList"></div>
        <button onclick="location.reload()" style="background:#999;">Kijelentkezés</button>
    </div>

    <div id="adminSection" class="section">
        <h3>Adminisztrátor</h3>
        <div id="adminList"></div>
        <button onclick="location.reload()">Vissza</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDOcRpZ3obqa21h4__ux57M4U9qyR8gULQ",
        databaseURL: "https://etel-polc-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "etel-polc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function handleLogin() {
        const id = document.getElementById('devID').value.trim(); // Fontos: NE legyen toUpperCase, mert az ID-ben kisbetűk is vannak!
        const pw = document.getElementById('pass').value.trim();
        const mail = document.getElementById('email').value.trim();
        const npw = document.getElementById('newPass').value.trim();

        // 1. Megnézzük, hogy már aktivált felhasználó-e
        db.ref('users/' + id + '/profil').once('value').then(s => {
            const p = s.val();
            if (p && p.password === pw) {
                startUserSession(id);
            } else {
                // 2. Ha nem, megnézzük az ideiglenes (ESP32 által küldött) fiókok között
                db.ref('temp_accounts/' + id).once('value').then(rs => {
                    const r = rs.val();
                    if (r && String(r.password) === String(pw)) {
                        if(!mail || !npw) return alert("Az aktiváláshoz adj meg e-mailt és egy új jelszót!");
                        
                        // Aktiválás: átmásoljuk a végleges helyre
                        db.ref('users/' + id + '/profil').set({ 
                            email: mail, 
                            password: npw,
                            activated: true 
                        });
                        // Töröljük a temp listából
                        db.ref('temp_accounts/' + id).remove();
                        
                        alert("Eszköz sikeresen aktiválva!");
                        startUserSession(id);
                    } else { 
                        alert("Hibás adatok! Ellenőrizd az ID-t és a jelszót!"); 
                    }
                });
            }
        });
    }

    function startUserSession(id) {
        document.getElementById('displayID').innerText = id;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('inventorySection').classList.add('active');
        
        // Raktár figyelése
        db.ref('incoming_scans/' + id).on('value', s => {
            const items = s.val();
            const list = document.getElementById('itemList');
            list.innerHTML = "<h3>Kamra tartalma:</h3>";
            
            if(!items) { list.innerHTML += "<p>A kamra üres. Szkennelj be valamit!</p>"; return; }

            for (let code in items) {
                const name = items[code].nev || "Ismeretlen termék";
                const qty = items[code].mennyiseg || 1;

                list.innerHTML += `
                    <div class="item-row">
                        <div style="flex:1">
                            <small>${code}</small><br>
                            <input type="text" id="n-${code}" value="${name === 'Ismeretlen termék' ? '' : name}" 
                            ${name !== 'Ismeretlen termék' ? 'disabled' : ''} placeholder="Add meg a nevét...">
                        </div>
                        <div class="qty">${qty} db</div>
                        ${name === 'Ismeretlen termék' ? `<button style="width:auto; padding:5px;" onclick="saveName('${id}','${code}')">OK</button>` : ''}
                    </div>`;
            }
        });
    }

    function saveName(id, code) {
        const val = document.getElementById('n-'+code).value.trim();
        if(val) db.ref('incoming_scans/'+id+'/'+code+'/nev').set(val);
    }

    // BEVÁSÁRLÓLISTA GENERÁLÁSA (Ami nincs elnevezve, vagy kevés van belőle)
    function generateShoppingList() {
        const id = document.getElementById('displayID').innerText;
        db.ref('incoming_scans/' + id).once('value', s => {
            const items = s.val();
            let listHtml = "<strong>Venni kell:</strong><ul>";
            let found = false;

            for(let code in items) {
                if(!items[code].nev || items[code].mennyiseg < 2) {
                    listHtml += `<li>${items[code].nev || "Ismeretlen kód: " + code}</li>`;
                    found = true;
                }
            }
            listHtml += "</ul>";
            
            const display = document.getElementById('shoppingListDisplay');
            display.innerHTML = found ? listHtml : "Mindenből van elég! 😊";
            display.style.display = 'block';
        });
    }

    // AI RECEPT (Szimulált AI kérés a kamra alapján)
    function getRecipe() {
        const id = document.getElementById('displayID').innerText;
        db.ref('incoming_scans/' + id).once('value', s => {
            const items = s.val();
            let ingredients = [];
            for(let code in items) { if(items[code].nev) ingredients.push(items[code].nev); }
            
            if(ingredients.length < 2) return alert("Kevés a cucc a recepthez!");
            
            alert("AI Javaslat a kamrádból (" + ingredients.join(", ") + "):\n\nKészíts egy gyors egytálételt! Pirítsd meg a hozzávalókat, és fűszerezd kedvedre. A konyhapultról adj hozzá egy kis hagymát!");
        });
    }

    function openAdmin() {
        const p = prompt("Admin PW:");
        if(p === "admin123") {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('adminSection').classList.add('active');
            db.ref('users').on('value', s => {
                const u = s.val();
                const al = document.getElementById('adminList');
                al.innerHTML = "";
                for(let d in u) {
                    al.innerHTML += `<div class="card">
                        <strong>${d}</strong> (E-mail: ${u[d].profil.email})<br>
                        Új jelszó: <input type="text" id="apw-${d}" value="${u[d].profil.password}">
                        <button onclick="db.ref('users/${d}/profil/password').set(document.getElementById('apw-${d}').value)">Mentés</button>
                    </div>`;
                }
            });
        }
    }
</script>
</body>
</html>
