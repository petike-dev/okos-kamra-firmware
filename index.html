<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okos Kamra</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .section { display: none; }
        .active { display: block; }
        h2 { color: #1a73e8; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #1557b0; }
        .btn-green { background: #34a853; }
        .btn-orange { background: #fbbc05; color: black; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; background: #fafafa; margin-bottom: 5px; border-radius: 8px; }
        .qty { background: #e8f0fe; padding: 5px 12px; border-radius: 20px; font-weight: bold; color: #1a73e8; }
        .shopping-list { background: #fffde7; border: 2px dashed #fbc02d; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 14px; }
        .admin-btn { background: #5f6368; margin-top: 25px; font-size: 11px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>🍎 Okos Kamra</h2>

    <div id="loginSection" class="section active">
        <p style="text-align:center; color:#666;">Add meg az eszközöd kódját!</p>
        <input type="text" id="devID" placeholder="Pantry-740c86c">
        <input type="password" id="pass" placeholder="Jelszó">
        
        <div id="activationFields" style="margin-top:20px; padding-top:10px; border-top:1px solid #eee;">
            <p style="font-size:12px; color:#888;">Első belépésnél add meg ezeket is:</p>
            <input type="email" id="email" placeholder="E-mail címed">
            <input type="password" id="newPass" placeholder="Végleges jelszavad">
        </div>

        <button onclick="handleLogin()">BELÉPÉS / AKTIVÁLÁS</button>
        <button class="admin-btn" onclick="openAdmin()">ADMIN PANEL</button>
    </div>

    <div id="inventorySection" class="section">
        <p>Eszköz ID: <strong id="displayID"></strong></p>
        
        <div style="display: flex; gap: 10px;">
            <button class="btn-green" onclick="generateShoppingList()">🛒 Listám</button>
            <button class="btn-orange" onclick="getRecipe()">🍳 Recept</button>
        </div>

        <div id="shoppingListDisplay" class="shopping-list" style="display:none;"></div>
        
        <div id="itemList" style="margin-top:20px;"></div>
        
        <button onclick="location.reload()" style="background:#ea4335; margin-top:30px;">Kijelentkezés</button>
    </div>

    <div id="adminSection" class="section">
        <h3>Felhasználók kezelése</h3>
        <div id="adminList"></div>
        <button onclick="location.reload()">Vissza</button>
    </div>
</div>

<script>
    // FIREBASE KONFIGURÁCIÓ
    const firebaseConfig = {
        apiKey: "AIzaSyDOcRpZ3obqa21h4__ux57M4U9qyR8gULQ",
        databaseURL: "https://etel-polc-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "etel-polc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function handleLogin() {
        const id = document.getElementById('devID').value.trim(); 
        const pw = document.getElementById('pass').value.trim();
        const mail = document.getElementById('email').value.trim();
        const npw = document.getElementById('newPass').value.trim();

        if(!id || !pw) return alert("Kérlek töltsd ki a mezőket!");

        console.log("Belépés megkísérelve:", id);

        // 1. Megnézzük, aktivált-e már
        db.ref('users/' + id + '/profil').once('value').then(s => {
            const user = s.val();
            if (user && user.password === pw) {
                startUserSession(id);
            } else {
                // 2. Ha nem, nézzük a temp_accounts-ban (aktiváló kód)
                db.ref('temp_accounts/' + id).once('value').then(rs => {
                    const temp = rs.val();
                    if (temp && String(temp.password) === String(pw)) {
                        if(!mail || !npw) return alert("Az aktiváláshoz adj meg e-mailt és új jelszót!");
                        
                        // Aktiválás
                        db.ref('users/' + id + '/profil').set({ 
                            email: mail, 
                            password: npw,
                            activated: true 
                        }).then(() => {
                            db.ref('temp_accounts/' + id).remove();
                            alert("Sikeres aktiválás! Mostantól az új jelszavaddal léphetsz be.");
                            startUserSession(id);
                        });
                    } else { 
                        alert("Hibás ID vagy jelszó!"); 
                    }
                });
            }
        });
    }

    function startUserSession(id) {
        document.getElementById('displayID').innerText = id;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('inventorySection').classList.add('active');
        
        // Valós idejű frissítés a kamrához
        db.ref('incoming_scans/' + id).on('value', s => {
            const items = s.val();
            const list = document.getElementById('itemList');
            list.innerHTML = "<h4>Készleten:</h4>";
            
            if(!items) { list.innerHTML += "<p>Még nincs semmi a kamrádban.</p>"; return; }

            for (let code in items) {
                const name = items[code].nev || "Ismeretlen termék";
                const qty = items[code].mennyiseg || 1;

                list.innerHTML += `
                    <div class="item-row">
                        <div style="flex:1">
                            <small style="color:#999">${code}</small><br>
                            <input type="text" id="n-${code}" value="${name === 'Ismeretlen termék' ? '' : name}" 
                            ${name !== 'Ismeretlen termék' ? 'disabled' : ''} placeholder="Termék neve..." 
                            style="width:80%; padding:5px; margin:0; border-bottom:1px solid #ddd;">
                        </div>
                        <div class="qty">${qty} db</div>
                        ${name === 'Ismeretlen termék' ? `<button style="width:auto; padding:5px; margin:0; margin-left:5px;" onclick="saveName('${id}','${code}')">Mentés</button>` : ''}
                    </div>`;
            }
        });
    }

    function saveName(id, code) {
        const val = document.getElementById('n-'+code).value.trim();
        if(val) {
            db.ref('incoming_scans/'+id+'/'+code+'/nev').set(val);
        } else {
            alert("Írj be egy nevet!");
        }
    }

    function generateShoppingList() {
        const id = document.getElementById('displayID').innerText;
        db.ref('incoming_scans/' + id).once('value', s => {
            const items = s.val();
            let buyList = [];
            for(let code in items) {
                // Ha nincs neve vagy csak 1 van belőle
                if(!items[code].nev || items[code].mennyiseg < 2) {
                    buyList.push(items[code].nev || "Ismeretlen (" + code + ")");
                }
            }
            
            const display = document.getElementById('shoppingListDisplay');
            if(buyList.length > 0) {
                display.innerHTML = "<strong>Bevásárlólista:</strong><br>" + buyList.join(", ");
                display.style.display = 'block';
            } else {
                display.innerHTML = "Mindenből van elég! 😊";
                display.style.display = 'block';
            }
        });
    }

    function getRecipe() {
        const id = document.getElementById('displayID').innerText;
        db.ref('incoming_scans/' + id).once('value', s => {
            const items = s.val();
            let names = [];
            for(let code in items) { if(items[code].nev) names.push(items[code].nev); }
            
            if(names.length < 2) return alert("Legalább 2 elnevezett termék kell a recepthez!");
            
            alert("💡 AI Tipp a kamrád alapján:\n\nHasználd fel ezeket: " + names.join(", ") + ".\nKészíts egy gyors tésztát vagy ragut belőlük!");
        });
    }

    function openAdmin() {
        const p = prompt("Admin Jelszó:");
        if(p === "admin") {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('adminSection').classList.add('active');
            db.ref('users').on('value', s => {
                const u = s.val();
                const al = document.getElementById('adminList');
                al.innerHTML = "";
                for(let d in u) {
                    al.innerHTML += `<div style="background:#eee; padding:10px; margin-bottom:5px; border-radius:5px;">
                        <strong>ID:</strong> ${d} <br>
                        <strong>Email:</strong> ${u[d].profil.email} <br>
                        <strong>Jelszó:</strong> ${u[d].profil.password}
                    </div>`;
                }
            });
        }
    }
</script>
</body>
</html>
