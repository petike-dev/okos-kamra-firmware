<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okos Kamra</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #f72585;
            --card-bg: #ffffff;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            margin: 0;
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
            color: #2b2d42;
        }

        .container { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
            margin: 20px;
            text-align: center;
        }

        h2 { 
            font-weight: 800; 
            font-size: 32px;
            margin-bottom: 30px;
            background: linear-gradient(to right, var(--primary), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section { display: none; opacity: 0; transform: translateY(10px); transition: 0.4s ease; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }

        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 12px; font-weight: 700; color: #8d99ae; margin-left: 5px; text-transform: uppercase; }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border: 2px solid #edf2f4; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); background: #fff; }

        button { 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 16px;
            margin-top: 15px; 
            transition: 0.3s;
        }

        button:hover { background: var(--secondary); transform: translateY(-2px); }

        .btn-green { background: #34a853; }
        .btn-orange { background: #fbbc05; color: #333; }

        .item-row { 
            display: flex; 
            align-items: center; 
            padding: 15px; 
            background: white;
            border-radius: 16px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #f1f3f5;
            text-align: left;
        }

        .qty-badge { 
            background: #e7f5ff; 
            padding: 6px 12px; 
            border-radius: 10px; 
            font-weight: 800; 
            color: var(--primary);
        }

        .shopping-list { 
            background: #fff9db; 
            border-left: 5px solid #fab005; 
            padding: 15px; 
            border-radius: 12px; 
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
        }

        .admin-link { color: #adb5bd; font-size: 12px; margin-top: 25px; cursor: pointer; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>PantryOS</h2>

    <div id="loginSection" class="section active">
        <div class="input-group">
            <label>ESZKÖZ AZONOSÍTÓ</label>
            <input type="text" id="devID" placeholder="Pantry-xxxxxxx">
        </div>
        <div class="input-group">
            <label>JELSZÓ</label>
            <input type="password" id="pass" placeholder="******">
        </div>
        
        <div id="activationBox" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ced4da;">
            <p style="font-size:11px; color:#adb5bd; font-weight:bold;">ÚJ ESZKÖZ AKTIVÁLÁSA:</p>
            <input type="email" id="email" placeholder="Email címed">
            <input type="password" id="newPass" placeholder="Választott saját jelszó">
        </div>

        <button onclick="handleLogin()">Belépés</button>
        <span class="admin-link" onclick="openAdmin()">Rendszergazdai beállítások</span>
    </div>

    <div id="inventorySection" class="section">
        <p style="color:#8d99ae; font-size: 14px;">Eszköz: <b id="displayID" style="color:var(--primary)"></b></p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn-green" onclick="generateShoppingList()">🛒 Lista</button>
            <button class="btn-orange" onclick="getRecipe()">🍳 Recept</button>
        </div>

        <div id="shoppingListDisplay" class="shopping-list" style="display:none;"></div>
        
        <div id="itemList" style="margin-top:25px;"></div>
        
        <button onclick="location.reload()" style="background:none; color:#adb5bd; box-shadow:none; text-decoration:underline; font-size:13px;">Kijelentkezés</button>
    </div>

    <div id="adminSection" class="section">
        <h3>Felhasználók</h3>
        <div id="adminList"></div>
        <button onclick="location.reload()">Vissza</button>
    </div>
</div>

<script>
    // FIREBASE KONFIGURÁCIÓ
    const firebaseConfig = {
        apiKey: "AIzaSyDOcRpZ3obqa21h4__ux57M4U9qyR8gULQ",
        databaseURL: "https://etel-polc-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "etel-polc"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function handleLogin() {
        const id = document.getElementById('devID').value.trim(); 
        const pw = document.getElementById('pass').value.trim();
        const mail = document.getElementById('email').value.trim();
        const npw = document.getElementById('newPass').value.trim();

        if(!id || !pw) return alert("Kérlek add meg az ID-t és a jelszót!");

        // 1. Megnézzük, aktivált-e már (users ág)
        db.ref('users/' + id + '/profil').once('value').then(s => {
            const user = s.val();
            if (user && user.password === pw) {
                // SIKERES BELÉPÉS SAJÁT JELSZÓVAL
                startUserSession(id);
            } else {
                // 2. Ha nem találja, nézzük a temp_accounts-ban (aktiváló kód)
                db.ref('temp_accounts/' + id).once('value').then(rs => {
                    const temp = rs.val();
                    if (temp && String(temp.password) === String(pw)) {
                        // HA AZ IDEIGLENES JELSZÓ JÓ, DE NINCS EMAIL/ÚJ PW
                        if(!mail || !npw) {
                            return alert("Aktiváláshoz add meg az email címed és az új jelszavadat!");
                        }
                        
                        // AKTIVÁLÁS: Átrakjuk a végleges helyre
                        db.ref('users/' + id + '/profil').set({ 
                            email: mail, 
                            password: npw,
                            activated: true 
                        }).then(() => {
                            // Töröljük az ideiglenes hozzáférést
                            db.ref('temp_accounts/' + id).remove();
                            alert("Sikeres aktiválás! Mostantól az új jelszavad él.");
                            startUserSession(id);
                        });
                    } else { 
                        alert("Hibás ID vagy jelszó!"); 
                    }
                });
            }
        });
    }

    function startUserSession(id) {
        document.getElementById('displayID').innerText = id;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('inventorySection').classList.add('active');
        
        // Kamra tartalmának figyelése
        db.ref('incoming_scans/' + id).on('value', s => {
            const items = s.val();
            const list = document.getElementById('itemList');
            list.innerHTML = "";
            
            if(!items) { list.innerHTML = "<p style='color:#adb5bd;'>A kamra üres...</p>"; return; }

            for (let code in items) {
                const name = items[code].nev || "Ismeretlen";
                const qty = items[code].mennyiseg || 1;

                list.innerHTML += `
                    <div class="item-row">
                        <div style="flex:1">
                            <span style="font-size:10px; color:#adb5bd;">${code}</span><br>
                            <input type="text" id="n-${code}" value="${name === 'Ismeretlen' ? '' : name}" 
                            ${name !== 'Ismeretlen' ? 'disabled style="border:none; font-weight:bold; padding:0;"' : 'style="padding:5px; margin:0;"'} placeholder="Nevezd el...">
                        </div>
                        <div class="qty-badge">${qty} db</div>
                        ${name === 'Ismeretlen' ? `<button style="width:40px; padding:5px; margin:0 0 0 10px;" onclick="saveName('${id}','${code}')">OK</button>` : ''}
                    </div>`;
            }
        });
    }

    function saveName(id, code) {
        const val = document.getElementById('n-'+code).value.trim();
        if(val) db.ref('incoming_scans/'+id+'/'+code+'/nev').set(val);
    }

    function generateShoppingList() {
        const id = document.getElementById('displayID').innerText;
        db.ref('incoming_scans/' + id).once('value', s => {
            const items = s.val();
            let buyList = [];
            for(let code in items) {
                if(!items[code].nev || items[code].mennyiseg < 2) {
                    buyList.push(items[code].nev || "Ismeretlen (" + code + ")");
                }
            }
            const display = document.getElementById('shoppingListDisplay');
            display.innerHTML = buyList.length ? "<b>Venni kell:</b><br>" + buyList.join(", ") : "Mindenből van elég! 😊";
            display.style.display = 'block';
        });
    }

    function getRecipe() {
        alert("AI Séf: A kamrádban lévő alapanyagok alapján javaslok egy gyors tésztát vagy egy finom omlettet!");
    }

    function openAdmin() {
        const p = prompt("Admin jelszó:");
        if(p === "admin123") {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('adminSection').classList.add('active');
            db.ref('users').on('value', s => {
                const u = s.val();
                const al = document.getElementById('adminList');
                al.innerHTML = "";
                for(let d in u) al.innerHTML += `<div class="item-row"><b>${d}</b><br>${u[d].profil.email}</div>`;
            });
        }
    }
</script>
</body>
</html>
