<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <h2>Végső Teszt</h2>
    <button onclick="teszt()">ADAT LEKÉRÉSE</button>
    <p id="kiiras">Várakozás...</p>

    <script>
        const config = {
            apiKey: "AIzaSyDOcRpZ3obqa21h4__ux57M4U9qyR8gULQ",
            databaseURL: "https://etel-polc-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "etel-polc"
        };
        firebase.initializeApp(config);
        const db = firebase.database();

        function teszt() {
            console.log("Gomb megnyomva, keresem: Pantry-740c86c");
            document.getElementById('kiiras').innerText = "Lekérés folyamatban...";

            db.ref('temp_accounts/Pantry-740c86c').once('value')
            .then(snapshot => {
                const data = snapshot.val();
                console.log("Adat megérkezett:", data);
                if(data) {
                    document.getElementById('kiiras').innerText = "SIKER! Jelszó az adatbázisban: " + data.password;
                } else {
                    document.getElementById('kiiras').innerText = "Hiba: Az ID nem található a temp_accounts mappában!";
                }
            })
            .catch(err => {
                console.error("Hiba:", err);
                document.getElementById('kiiras').innerText = "Firebase Hiba: " + err.message;
            });
        }
    </script>
</body>
</html>
