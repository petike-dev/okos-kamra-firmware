<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okos Kamra - Teljes Kezelőfelület</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #1a73e8; text-align: center; }
        .section { display: none; }
        .active { display: block; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .qty { font-weight: bold; color: #1a73e8; background: #e8f0fe; padding: 5px 10px; border-radius: 5px; }
        .admin-btn { background: #666; margin-top: 30px; font-size: 11px; opacity: 0.6; }
        .admin-btn:hover { opacity: 1; }
        .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Okos Kamra</h2>

    <div id="setupSection" class="section active">
        <p style="text-align:center;">Belépés vagy Aktiválás</p>
        <input type="text" id="devID" placeholder="Eszköz ID (pl. KAMRA-******)">
        <input type="text" id="tempPW" placeholder="Ideiglenes PW / Jelszó">
        <hr>
        <p style="font-size: 12px; color: #777; text-align: center;">Első aktiválásnál add meg az e-mailt is:</p>
        <input type="email" id="userEmail" placeholder="E-mail cím">
        <input type="password" id="newPass" placeholder="Új jelszó (ha most aktiválsz)">
        
        <button onclick="aktivalas()">BELÉPÉS / AKTIVÁLÁS</button>

        <button class="admin-btn" onclick="toggleAdmin()">ADMIN PANEL</button>
    </div>

    <div id="inventorySection" class="section">
        <p>Eszköz: <strong id="displayID"></strong></p>
        <div id="itemList"></div>
        <button onclick="location.reload()" style="background:#999; margin-top: 20px;">Kijelentkezés</button>
    </div>

    <div id="adminSection" class="section">
        <h3>Adminisztrátor</h3>
        <div id="adminList"></div>
        <button onclick="location.reload()" style="background:#444;">Vissza a főoldalra</button>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyDOcRpZ3obqa21h4__ux57M4U9qyR8gULQ",
        databaseURL: "https://etel-polc-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "etel-polc-default",
        storageBucket: "etel-polc-default.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function aktivalas() {
        const id = document.getElementById('devID').value.trim().toUpperCase();
        const tpw = document.getElementById('tempPW').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const npw = document.getElementById('newPass').value.trim();

        if(!id || !tpw) { alert("ID és Jelszó kötelező!"); return; }

        db.ref('regisztracio/' + id).once('value').then((snapshot) => {
            const data = snapshot.val();
            
            // Ha már aktiválva van, a profilban lévő jelszót nézzük
            db.ref('users/' + id + '/profil').once('value').then((pSnap) => {
                const profil = pSnap.val();
                
                if (profil && profil.password === tpw) {
                    // Sima belépés már létező jelszóval
                    loginSuccess(id);
                } else if (data && data.temp_pw == tpw) {
                    // Első aktiválás
                    if(!email || !npw) { alert("Első belépésnél adj meg e-mailt és új jelszót!"); return; }
                    db.ref('users/' + id + '/profil').set({ email: email, password: npw, status: "active" });
                    db.ref('regisztracio/' + id + '/siker').set(true);
                    loginSuccess(id);
                } else {
                    alert("Hibás ID vagy Jelszó!");
                }
            });
        });
    }

    function loginSuccess(id) {
        showSection('inventorySection');
        document.getElementById('displayID').innerText = id;
        betoltRaktar(id);
    }

    function betoltRaktar(id) {
        db.ref('users/' + id + '/raktar').on('value', (snapshot) => {
            const items = snapshot.val();
            const listDiv = document.getElementById('itemList');
            listDiv.innerHTML = items ? "" : "<p>Szkennelj be valamit az ESP32-vel!</p>";
            
            for (let code in items) {
                const hasName = items[code].nev;
                listDiv.innerHTML += `
                    <div class="item-row">
                        <div style="flex:1">
                            <small>${code}</small><br>
                            <input type="text" id="in-${code}" value="${hasName || ''}" 
                            ${hasName ? 'disabled style="border:none; background:none; font-weight:bold;"' : ''} 
                            placeholder="Termék neve...">
                        </div>
                        <div class="qty">${items[code].mennyiseg} db</div>
                        ${!hasName ? `<button style="width:auto; padding:5px 10px;" onclick="mentNev('${id}','${code}')">OK</button>` : '✓'}
                    </div>`;
            }
        });
    }

    function mentNev(id, code) {
        const val = document.getElementById('in-'+code).value.trim();
        if(val) db.ref('users/'+id+'/raktar/'+code+'/nev').set(val);
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function toggleAdmin() {
        const p = prompt("Admin Jelszó:");
        if(p === "admin123") {
            showSection('adminSection');
            db.ref('users').on('value', (s) => {
                const u = s.val();
                const al = document.getElementById('adminList');
                al.innerHTML = "";
                for(let d in u) {
                    al.innerHTML += `<div class="card">
                        <strong>Eszköz: ${d}</strong><br>
                        Email: ${u[d].profil ? u[d].profil.email : 'Nincs'}<br>
                        <button onclick="db.ref('users/${d}').remove()" style="background:red; font-size:10px; width:auto; padding:3px 8px; margin-top:5px;">Eszköz Törlése</button>
                    </div>`;
                }
            });
        }
    }
</script>
</body>
</html>
