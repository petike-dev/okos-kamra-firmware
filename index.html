<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Okos Kamra Teszt</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div style="max-width:300px; margin: 50px auto; font-family: sans-serif;">
        <h3>Belépés Teszt</h3>
        <input type="text" id="devID" placeholder="Pantry-740c86c" style="width:100%; margin-bottom:10px;">
        <input type="password" id="pass" placeholder="248971" style="width:100%; margin-bottom:10px;">
        <button onclick="handleLogin()" style="width:100%; padding:10px; background:blue; color:white;">BELÉPÉS</button>
        <p id="status" style="color:red; font-size:12px;"></p>
    </div>

<script>
    // PONTOS KONFIGURÁCIÓ
    const firebaseConfig = {
        apiKey: "AIzaSyDOcRpZ3obqa21h4__ux57M4U9qyR8gULQ",
        databaseURL: "https://etel-polc-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "etel-polc" // Itt kivettem a -default-ot!
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function handleLogin() {
        const id = document.getElementById('devID').value.trim();
        const pw = document.getElementById('pass').value.trim();
        const status = document.getElementById('status');

        console.log("Lekérés indítása: ", id);
        status.innerText = "Kapcsolódás...";

        // Közvetlen lekérés a temp_accounts-ból
        db.ref('temp_accounts/' + id).once('value')
        .then(snapshot => {
            const data = snapshot.val();
            console.log("Firebase válasz:", data);

            if (data) {
                if (String(data.password) === String(pw)) {
                    alert("SIKER! Bejelentkezve.");
                    status.style.color = "green";
                    status.innerText = "Sikeres belépés!";
                } else {
                    alert("Rossz jelszó! Az adatbázisban ez van: " + data.password);
                    status.innerText = "Hibás jelszó.";
                }
            } else {
                alert("Nincs ilyen ID az adatbázisban!");
                status.innerText = "Nincs ilyen ID.";
            }
        })
        .catch(error => {
            console.error("Hiba történt:", error);
            alert("Firebase hiba! (Lásd a konzolt)");
            status.innerText = "Hiba: " + error.message;
        });
    }
</script>
</body>
</html>
